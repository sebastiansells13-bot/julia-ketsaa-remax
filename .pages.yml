media:
  input: src/_includes/img
  output: /img

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: src/posts
    view:
      fields: [title, date, tags]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: The main headline for the post. Keep it concise and descriptive.

      - name: description
        label: Description
        type: string
        required: true
        description: A short summary for SEO and social sharing. Max 160 characters.
        options:
          maxlength: 160

      - name: date
        label: Date
        type: date
        required: true
        description: Publication date.
        options:
          format: yyyy-MM-dd
          time: false

      - name: tags
        label: Tags
        type: select
        default: market-update
        description: Categorize the post.
        options:
          values: [market-update, seller-tips, buyer-tips, neighborhood-guide, announcement]
          creatable: true

      - name: layout
        label: Layout
        type: string
        hidden: true
        default: layouts/post.njk

      - name: image
        label: Cover Image
        type: image
        description: Main image for the post. Used as the hero image and for social sharing.
        options:
          path: blog

      - name: body
        label: Body
        type: rich-text
        description: Post content.

  - name: listings
    label: Listings
    type: file
    path: src/_data/listings.json
    fields:
      - name: list
        label: Listings
        type: object
        list:
          collapsible:
            summary: "{fields.address} — {fields.price}"
        fields:
          - name: address
            label: Street Address
            type: string
            required: true

          - name: location
            label: City, State
            type: string
            required: true

          - name: price
            label: Price
            type: string
            required: true
            description: "Formatted for display, e.g. $425,000"

          - name: beds
            label: Bedrooms
            type: number
            required: true

          - name: baths
            label: Bathrooms
            type: number
            required: true

          - name: sqft
            label: Square Footage
            type: number
            required: true

          - name: yearBuilt
            label: Year Built
            type: number

          - name: lotSize
            label: Lot Size
            type: string
            description: "e.g. 0.21 acres"

          - name: lat
            label: Map Latitude
            type: number
            description: "Optional — powers this listing's pin on the Listings page map. Right-click the spot on Google Maps and copy the first number from \"What's here?\". Leave blank and it just won't get a pin."

          - name: lng
            label: Map Longitude
            type: number
            description: "Optional — the second number from \"What's here?\" on Google Maps. Leave blank along with Map Latitude if you don't want a pin for this listing."

          - name: status
            label: Status
            type: select
            default: For Sale
            options:
              values: [For Sale, Pending, Sold]

          - name: justListed
            label: Just Listed
            type: boolean
            default: false
            description: Shows this listing under the "Just Listed" tab on the Listings page. Uncheck it after a few weeks so the tab stays current.

          - name: openHouse
            label: Open House
            type: string
            description: "Date and time, e.g. \"Sat, Sep 13 · 1–3 PM\". Leave blank if there isn't one scheduled — shows this listing under the \"Open Houses\" tab and as a banner on its own page."

          - name: image
            label: Cover Photo
            type: image
            description: Leave blank to show a placeholder illustration instead (used for sample listings). Shown on listing cards and as the first gallery photo.
            options:
              path: listings

          - name: images
            label: Additional Photos
            type: image
            list: true
            description: Extra photos shown in the gallery on the listing's own page, alongside the cover photo.
            options:
              path: listings

          - name: videoUrl
            label: Video Tour URL
            type: string
            description: A YouTube or Vimeo link (any format — a share link is fine). Leave blank if there isn't one.

          - name: zillowUrl
            label: Zillow Listing URL
            type: string
            description: Link to this property's page on Zillow. Leave blank if it isn't listed there (or not yet).

          - name: redfinUrl
            label: Redfin Listing URL
            type: string
            description: Link to this property's page on Redfin. Leave blank if it isn't listed there (or not yet).

          - name: blurb
            label: Short Description
            type: string
            description: One sentence shown on the listing card.

          - name: description
            label: Full Description
            type: rich-text
            description: Longer write-up shown on the listing's own page.

          - name: features
            label: Features
            type: string
            list: true
            description: Short bullet points, e.g. "2-car garage"

          - name: isSample
            label: This is a sample listing (not a real property)
            type: boolean
            default: false
            description: Shows a "Sample" badge and keeps the page out of Google search results. Leave unchecked for real listings.

  - name: services
    label: How I Can Help
    type: file
    path: src/_data/services.json
    fields:
      - name: list
        label: Services
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - name: title
            label: Service Name
            type: string
            required: true

          - name: description
            label: Description
            type: rich-text
            required: true
            description: What this service is and who it's for (1–3 sentences).

          - name: icon
            label: Icon Image
            type: image
            description: Optional small icon or photo representing this service.
            options:
              path: services

  - name: testimonials
    label: Testimonials
    type: file
    path: src/_data/testimonials.json
    fields:
      - name: list
        label: Testimonials
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - name: quote
            label: Quote
            type: rich-text
            required: true

          - name: name
            label: Client Name & Role
            type: string
            required: true
            description: "e.g. Jamie R., Buyer"

  - name: business
    label: Agent & Business Info
    type: file
    path: src/_data/business.json
    fields:
      - name: name
        label: Agent Name
        type: string
        required: true

      - name: title
        label: Title / Brokerage
        type: string
        required: true

      - name: tagline
        label: Tagline
        type: string
        required: true

      - name: phoneCell
        label: Cell Phone
        type: string

      - name: phoneOffice
        label: Office Phone
        type: string

      - name: email
        label: Email
        type: string

      - name: address
        label: Office Address
        type: string
        description: Full address as shown on the Contact page.

      - name: streetAddress
        label: Street Address (for SEO data)
        type: string
        description: Just the street portion, e.g. "2805 Doral Ct." Keep in sync with Office Address above.

      - name: addressLocality
        label: City (for SEO data)
        type: string

      - name: addressRegion
        label: State abbreviation (for SEO data)
        type: string

      - name: postalCode
        label: ZIP Code (for SEO data)
        type: string

      - name: license
        label: License Text
        type: string

      - name: licenseNumber
        label: License Number
        type: string
        description: "Your official real estate license number, e.g. REC-2022-0066. Shown alongside the License Text above."

      - name: disclaimer
        label: Brokerage Disclaimer
        type: string
        description: "Standard RE/MAX franchise disclaimer — leave as \"Each RE/MAX® office is independently owned and operated.\" unless your broker tells you otherwise."

      - name: photo
        label: Agent Photo
        type: image
        options:
          path: agent

      - name: bio
        label: Bio
        type: rich-text

      - name: social
        label: Social Links
        type: object
        fields:
          - name: instagram
            label: Instagram URL
            type: string
          - name: facebook
            label: Facebook URL
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
