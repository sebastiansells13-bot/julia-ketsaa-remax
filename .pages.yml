media:
  input: src/_includes/img
  output: /img

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: src/posts
    view:
      fields: [title, date, tags]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: The main headline for the post. Keep it concise and descriptive.

      - name: description
        label: Description
        type: string
        required: true
        description: A short summary for SEO and social sharing. Max 160 characters.
        options:
          maxlength: 160

      - name: date
        label: Date
        type: date
        required: true
        description: Publication date.
        options:
          format: yyyy-MM-dd
          time: false

      - name: tags
        label: Tags
        type: select
        default: market-update
        description: Categorize the post.
        options:
          values: [market-update, seller-tips, buyer-tips, neighborhood-guide, announcement]
          creatable: true

      - name: layout
        label: Layout
        type: string
        hidden: true
        default: layouts/post.njk

      - name: image
        label: Cover Image
        type: image
        description: Main image for the post. Used as the hero image and for social sharing.
        options:
          path: blog

      - name: body
        label: Body
        type: rich-text
        description: Post content.

  - name: listings
    label: Listings
    type: file
    path: src/_data/listings.json
    fields:
      - name: list
        label: Listings
        type: object
        list:
          collapsible:
            summary: "{fields.address} — {fields.price}"
        fields:
          - name: address
            label: Street Address
            type: string
            required: true

          - name: location
            label: City, State
            type: string
            required: true

          - name: price
            label: Price
            type: string
            required: true
            description: "Formatted for display, e.g. $425,000"

          - name: beds
            label: Bedrooms
            type: number
            required: true

          - name: baths
            label: Bathrooms
            type: number
            required: true

          - name: sqft
            label: Square Footage
            type: number
            required: true

          - name: status
            label: Status
            type: select
            default: For Sale
            options:
              values: [For Sale, Pending, Sold]

          - name: image
            label: Photo
            type: image
            required: true
            options:
              path: listings

          - name: blurb
            label: Short Description
            type: string
            description: One sentence shown on the listing card.

  - name: services
    label: How I Can Help
    type: file
    path: src/_data/services.json
    fields:
      - name: list
        label: Services
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - name: title
            label: Service Name
            type: string
            required: true

          - name: description
            label: Description
            type: rich-text
            required: true
            description: What this service is and who it's for (1–3 sentences).

          - name: icon
            label: Icon Image
            type: image
            description: Optional small icon or photo representing this service.
            options:
              path: services

  - name: testimonials
    label: Testimonials
    type: file
    path: src/_data/testimonials.json
    fields:
      - name: list
        label: Testimonials
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        fields:
          - name: quote
            label: Quote
            type: rich-text
            required: true

          - name: name
            label: Client Name & Role
            type: string
            required: true
            description: "e.g. Jamie R., Buyer"

  - name: business
    label: Agent & Business Info
    type: file
    path: src/_data/business.json
    fields:
      - name: name
        label: Agent Name
        type: string
        required: true

      - name: title
        label: Title / Brokerage
        type: string
        required: true

      - name: tagline
        label: Tagline
        type: string
        required: true

      - name: phoneCell
        label: Cell Phone
        type: string

      - name: phoneOffice
        label: Office Phone
        type: string

      - name: email
        label: Email
        type: string

      - name: address
        label: Office Address
        type: string

      - name: license
        label: License Text
        type: string

      - name: disclaimer
        label: Brokerage Disclaimer
        type: string
        description: "Standard RE/MAX franchise disclaimer — leave as \"Each RE/MAX® office is independently owned and operated.\" unless your broker tells you otherwise."

      - name: photo
        label: Agent Photo
        type: image
        options:
          path: agent

      - name: bio
        label: Bio
        type: rich-text

      - name: social
        label: Social Links
        type: object
        fields:
          - name: instagram
            label: Instagram URL
            type: string
          - name: facebook
            label: Facebook URL
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
